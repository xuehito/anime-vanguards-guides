# Auto-deploy static site to Cloudflare Pages on push to main.
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — API Token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  — from Cloudflare dashboard (right sidebar on Overview)
#
# Optional: create the Pages project once:
#   npx wrangler pages project create anime-vanguards-guides --production-branch=main

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE: https://animevanguards.co

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=anime-vanguards-guides --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Preview deploy (PR)
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=anime-vanguards-guides --branch=${{ github.head_ref }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
