# Auto-deploy static site to Cloudflare Pages on push to main.
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — API Token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  — from Cloudflare dashboard (right sidebar on Overview)

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: anime-vanguards-guides
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Wrangler
        run: npm install -D wrangler@4

      - name: Build
        run: npm run build
        env:
          SITE: https://animevanguards.co

      - name: Ensure Pages project exists
        if: github.event_name != 'pull_request'
        run: |
          set +e
          npx wrangler pages project list 2>&1 | tee /tmp/cf-projects.txt
          if grep -qE "(^| )${PAGES_PROJECT}( |$)" /tmp/cf-projects.txt; then
            echo "Project ${PAGES_PROJECT} already exists."
          else
            echo "Creating project ${PAGES_PROJECT}..."
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        id: deploy
        run: |
          npx wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch=main \
            --commit-dirty=true

      - name: Preview deploy (PR)
        if: github.event_name == 'pull_request'
        run: |
          # Preview projects must exist; create on first PR if needed
          set +e
          npx wrangler pages project list 2>&1 | tee /tmp/cf-projects.txt
          if ! grep -qE "(^| )${PAGES_PROJECT}( |$)" /tmp/cf-projects.txt; then
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main
          fi
          set -e
          npx wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch="${{ github.head_ref }}" \
            --commit-dirty=true
